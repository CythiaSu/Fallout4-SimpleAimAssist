[General]
bEnableAimAssist=1
bEnableLogging=1
bAutoTriggerOnZoom=1
; Normal assist always follows Fallout 4's actual aim/block state.
; 0 = disable the additional persistent target-lock control.
; 1 = enable the additional persistent target-lock control.
;     Gamepad: short right-stick click locks/cancels; hold it for 0.25 seconds to perform its currently assigned action.
;     Keyboard/mouse: no default lock key. Assign a custom MCM hotkey.
; The separate control can be used together with Toggle Aim mods.
bToggleAimMode=0
; 0 = sneak, 1 = toggle first/third person. Used only for long right-stick press in independent mode.
iGamepadLongPressAction=0

[InputMode]
; 0 = keyboard/mouse only, 1 = gamepad only, 2 = keyboard/mouse + gamepad auto.
; Auto mode follows the most recent input device and switches its tuning profile.
iInputMode=1

[Zoom]
; Iron sights, reflex sights, and low zoom only. High magnification quietly disables lock-on.
bDisableOnHighZoom=1
fHighZoomRatio=1.60

[Targeting]
; Initial acquisition cone. The gamepad profile overrides this with 16 degrees.
fSearchConeDegrees=12.0
fMinLockDistance=150.0
fMaxLockDistance=2400.0
fMeleeLockDistance=900.0
iAimAnchor=0
; A locked target may move slightly beyond acquisition range before the lock is released.
fLockRetentionDistanceScale=1.15
; While aim is held, retry target acquisition and move to the next valid enemy after death.
fRetargetDelay=0.12
bOnlyCombatTargets=1
; 0 = only targets already in combat can be acquired.
; 1 = hostile targets may be acquired before combat starts.
bAllowOutOfCombatHostileTargets=0
; Prefer each race's torso body-part node. Falls back to common-race height presets.
bUseRaceAimPoints=1
; Uses Fallout 4's native player line-of-sight test. This is intentionally not an MCM option.
bRequireLineOfSight=1
; Kept for compatibility with older INI files; native LOS no longer uses a hit fraction.
fVisibleHitFraction=0.30
fLineOfSightCheckInterval=0.25
fLineOfSightGracePeriod=0.40

[LockOn]
; Slightly softer base response keeps recoil control comfortable. Fast lateral targets receive a small automatic boost.
fYawResponse=9.0
fPitchResponse=6.5
fMaxYawSpeed=220.0
fMaxPitchSpeed=160.0
fDeadZoneDegrees=0.06
; Horizontal lead is deliberately capped to help sprinting targets without pulling past a sudden stop.
fTargetLeadSeconds=0.065
fTargetLeadMaxDistance=65.0

[Assist]
; Normal aim assist performs one initial correction, then stops moving the camera when disabled.
; Independent target lock always keeps continuous crosshair tracking.
bEnableCrosshairTracking=1
; Runtime value is controlled by the MCM Lock Strength slider.
fAssistStrengthScale=0.50
; 0 disables automatic release. Range: 0-15 seconds. Default: disabled.
fNoFireTimeoutSeconds=0.0
; Independent lock ignores the inactivity timeout by default.
bNoFireTimeoutAffectsIndependentLock=0
fHorizontalOffsetDegrees=0.00
; Used only if no race torso node or race preset can be resolved.
fTorsoHeight=95.0

[Gamepad]
; Wider acquisition and faster tracking for analog-stick play.
fSearchConeDegrees=16.0
fLockYawResponse=10.0
fLockPitchResponse=8.0
fLockMaxYawSpeed=300.0
fLockMaxPitchSpeed=220.0

[Focus]
; Eagle Eye is disabled in the lock-on redesign. Kept only to neutralize old MCM hotkey calls.
bEnableFocusMode=0

[Feedback]
bEnableTargetMarker=1
iTargetMarkerStyle=6
bShowTargetAcquiredMessage=0
bShowLockHudHint=0

[ManualAim]
; 0.00 = no wait, 0.18 = short wait, 0.35 = long wait.
fReturnDelay=0.18
; Target switch gesture preset. 0 disables target switching.
iTargetSwitchLevel=2
; Fraction of manual offset retained while aiming. Lower values add stronger damping.
fGamepadOffsetRetention=1.00
fKeyboardMouseOffsetRetention=1.00
